<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="中国法定节假日工作日历，依据官方通知整理，可下载系统导入表格。">
  <title>中国节假日工作日历</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="#" aria-label="中国节假日工作日历首页">
      <span class="brand-mark" aria-hidden="true">历</span>
      <span>中国节假日工作日历</span>
    </a>
    <span class="monitor"><i data-lucide="refresh-cw" aria-hidden="true"></i> 每日检查官方更新</span>
  </header>

  <main>
    <section class="intro">
      <span class="eyebrow">OFFICIAL RELEASES</span>
      <h1>节假日工作日历</h1>
      <p>官方发布后复核更新，下载即可导入。</p>
    </section>

    <section class="downloads" aria-labelledby="downloads-title">
      <div class="section-head">
        <h2 id="downloads-title">年度文件</h2>
        <span><i data-lucide="badge-check" aria-hidden="true"></i> 已复核</span>
      </div>
      <div id="year-list" class="year-list" aria-live="polite"></div>
      <div class="pending">
        <div>
          <strong>2027</strong>
          <span>等待官方发布</span>
        </div>
        <i data-lucide="radar" aria-hidden="true"></i>
      </div>
    </section>
  </main>

  <footer>
    <span>仅收录正式发布的全国性节假日安排</span>
    <a href="https://github.com/shawcc/china-holiday-calendar" target="_blank" rel="noreferrer">
      更新记录 <i data-lucide="arrow-up-right" aria-hidden="true"></i>
    </a>
  </footer>
</body>
</html>
